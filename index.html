<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171a17">
  <meta name="description" content="A small doorway to something interesting. Pick a topic or let curiosity choose a sourced fact for you.">
  <title>Curiosity</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="curiosity" aria-label="Discover something interesting">
    <div class="workspace">
      <form id="curiosity-form" class="input-box" autocomplete="off">
        <label for="topic" class="sr-only">Choose any topic, or leave blank for a random discovery</label>
        <input id="topic" name="topic" type="text" maxlength="200" placeholder="Tell me something interesting about..." aria-describedby="input-help" enterkeyhint="go" spellcheck="false">
        <span id="input-help" class="sr-only">Enter a topic and press Enter. Leave it blank or use Surprise me for a random discovery from Wikipedia.</span>
        <button id="surprise" class="icon-button" type="button" title="Surprise me" aria-label="Surprise me with a random fact">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="8" cy="8" r=".8" fill="currentColor"/><circle cx="16" cy="8" r=".8" fill="currentColor"/><circle cx="12" cy="12" r=".8" fill="currentColor"/><circle cx="8" cy="16" r=".8" fill="currentColor"/><circle cx="16" cy="16" r=".8" fill="currentColor"/></svg>
        </button>
        <button id="discover" class="submit-button" type="submit" title="Discover a fact" aria-label="Discover a fact">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>
      <section id="result" class="result" aria-live="polite" aria-atomic="true" hidden>
        <h1 id="fact-title"></h1>
        <p id="fact-text" class="fact-text"></p>
        <div id="result-footer" class="result-footer">
          <div class="attribution"><a id="source" target="_blank" rel="noopener noreferrer">From Wikipedia <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3h7v7M21 3 10 14"/><path d="M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/></svg></a><a class="license" href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener noreferrer">CC BY-SA 4.0</a></div>
        </div>
        <div id="suggestions" class="suggestions" hidden></div>
      </section>
      <p id="status" class="status" role="status" hidden></p>
    </div>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
